name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # o dataset versionado tem que ser exatamente o que o gerador produz
      - run: npm run gerar
      - run: git diff --exit-code -- casos dataset.jsonl INDICE.md COBERTURA.md regua.json sessoes
